# Verificación automática en cada push (PB-007).
#
# No despliega nada: Railway auto-despliega por su cuenta al detectar el push.
# Esto sólo evita que llegue a main algo que no pasa los checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Usa la versión de .python-version, la misma que el contenedor.
      - name: Instalar dependencias
        run: uv sync --locked

      - name: Tests
        run: uv run pytest

      - name: Linting
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipado
        run: |
          uv run mypy src
          uv run mypy tests

  # Que el Dockerfile no se rompa sin que nos enteremos: se construye igual que
  # en Railway, pero no se publica en ningún lado.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
